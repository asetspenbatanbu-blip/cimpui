<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dapur Mama RaraLita - Pesanan Kue, Roti & Gorengan</title>
    <meta name="description" content="Aplikasi pesanan kue kering, bolu, roti, pizza dan gorengan khusus mobile." />
    <meta property="og:title" content="Dapur Mama RaraLita - Pesanan Kue, Roti & Gorengan" />
    <meta property="og:description" content="Aplikasi pesanan kue kering, bolu, roti, pizza dan gorengan khusus mobile." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#8A9A5B" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Pastikan service worker lama di-unregister jika pernah terdaftar
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#FDFBF7] text-gray-800 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
