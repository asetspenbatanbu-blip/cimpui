<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dapur Mama RaraLita - Pesanan Kue, Roti & Gorengan</title>
    <meta name="description" content="Aplikasi pesanan kue kering, bolu, roti, pizza dan gorengan khusus mobile." />
    <meta property="og:title" content="Dapur Mama RaraLita - Pesanan Kue, Roti & Gorengan" />
    <meta property="og:description" content="Aplikasi pesanan kue kering, bolu, roti, pizza dan gorengan khusus mobile." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MamaRaraLita" />
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script>
      // Registrasi Service Worker seawal mungkin untuk kriteria WebAPK Chrome Android
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (err) {
          console.warn('SW register notice:', err);
        });
      }

      // Tangkap event instalasi browser seawal mungkin agar tidak terlewat
      window.__pwaDeferredPrompt = null;
      window.__pwaInstalled = false;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-deferred-prompt-ready', { detail: e }));
      });

      window.addEventListener('appinstalled', function () {
        window.__pwaInstalled = true;
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </head>
  <body class="bg-[#FDFBF7] text-gray-800 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
